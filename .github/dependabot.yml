version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Matches minimumReleaseAge in bunfig.toml
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Bump together with the Node major in .nvmrc
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # Exact names: Dependabot's bun updater did not match @playwright/* against @playwright/test
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tanstack-query:
        patterns: ['@tanstack/react-query', '@tanstack/eslint-plugin-query']
      tanstack-router:
        patterns:
          - '@tanstack/react-router'
          - '@tanstack/router-cli'
          - '@tanstack/router-plugin'
          - '@tanstack/eslint-plugin-router'
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/vite']
      vite:
        patterns: ['vite', '@vitejs/plugin-react', '@rolldown/plugin-babel']
      vitest:
        patterns: ['vitest', '@vitest/browser-playwright', 'vitest-browser-react']
      # Both must move together: each pins its own browser build
      playwright:
        patterns: ['playwright', '@playwright/test']
      oxc:
        patterns: ['oxlint', 'oxlint-tsgolint', 'oxfmt']
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
