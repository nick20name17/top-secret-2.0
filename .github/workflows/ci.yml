name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # --frozen-lockfile accepts a lockfile from another Bun or another config,
      # such as Dependabot's, so check that this config writes the same one
      - run: bun install
      - run: git diff --exit-code bun.lock
      - name: Check the playwright-cli skill matches the installed CLI
        run: |
          bunx playwright-cli install --skills
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - run: bunx playwright install --with-deps --only-shell chromium
      - run: cp .env.example .env
      - run: bun run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
